<text x="48" y="514" fill="#ededf0" font-size="16">SEPARATE ANALYTICS OUTPUTS</text>
<text x="48" y="548" fill="#a5a9b1" font-size="17">Local Streamlit summaries · Synthetic customer risk model · PySpark Parquet datasets</text>
