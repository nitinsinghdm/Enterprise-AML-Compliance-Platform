<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">NorthStar: how payments become reviewable AML alerts</title>
<desc id="desc">Synthetic payments pass PostgreSQL validation. SQL monitoring produces timestamped alert evidence, which the browser replays for review. Separate analytics exports support local models and Spark; cloud services need configuration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#898d96"/></marker></defs>
<rect width="1440" height="680" rx="20" fill="#090a0b"/>
<g font-family="Arial, sans-serif">
<text x="48" y="48" fill="#9b9fa8" font-family="monospace" font-size="13" letter-spacing="2">NORTHSTAR / HOW IT WORKS</text>
<text x="48" y="100" fill="#ededf0" font-size="34">FROM PAYMENT TO REVIEWABLE EVIDENCE</text>
<text x="48" y="136" fill="#a5a9b1" font-size="18">A reproducible synthetic workflow. Every alert has a rule, a time and supporting records.</text>
<g fill="#101214" stroke="#303338"><rect x="48" y="182" width="300" height="252" rx="12"/><rect x="396" y="182" width="300" height="252" rx="12"/><rect x="744" y="182" width="300" height="252" rx="12"/><rect x="1092" y="182" width="300" height="252" rx="12"/></g>
