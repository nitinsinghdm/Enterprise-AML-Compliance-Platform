<g fill="#ededf0" font-size="22"><text x="72" y="261">SYNTHETIC PAYMENTS</text><text x="420" y="261">CHECKED RECORDS</text><text x="768" y="261">TIMESTAMPED ALERTS</text><text x="1116" y="261">EVIDENCE REVIEW</text></g>
<g fill="#a5a9b1" font-size="17">
<text x="72" y="303">Accounts and beneficiaries</text><text x="72" y="335">Ordinary activity + scenarios</text><text x="72" y="367">Repeatable Python generation</text>
<text x="420" y="303">PostgreSQL staging → core</text><text x="420" y="335">Rejects and duplicate checks</text><text x="420" y="367">Audited ingestion and exports</text>
